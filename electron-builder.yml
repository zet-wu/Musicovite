appId: com.musicovite.app
productName: Musicovite
beforePack: scripts/before-pack.cjs
copyright: Copyright © 2025-present asxez MusicBox
directories:
  output: dist
  buildResources: build
files:
  - dist/main/**/*
  - "!dist/main/NativeAudio.node"
  - "!dist/main/metadata_editor*"
  - build/branding/**/*
  - LICENSE
  - src/renderer/public/**/*
  - node_modules/**/*
  - "!node_modules/*/{test,__tests__,tests,powered-test,example,examples}"
  - "!node_modules/**/*.d.ts"
  - "!node_modules/.bin"
  - "!**/*.{iml,o,hprof,orig,pyc,pyo,rbc,swp,csproj,sln,xproj}"
  - "!.editorconfig"
  - "!**/._*"
  - "!**/{.DS_Store,.git,.hg,.svn,CVS,RCS,SCCS,.gitignore,.gitattributes}"
  - "!**/{__pycache__,thumbs.db,.flowconfig,.idea,.vs,.nyc_output}"
  - "!**/{appveyor.yml,.travis.yml,circle.yml}"
  - "!**/{npm-debug.log,yarn.lock,.yarn-integrity,.yarn-metadata.json}"
  - "!**/requirements.txt"
  - "!**/pyinstaller.spec"
  - "!**/nuitka.config"
  - "!**/build/pyinstaller/**/*"
  - "!**/dist/python-modules/**/*"
  - "!src/main/metadata_editor*"

# macOS 配置
mac:
  extraResources:
    - from: dist/main/metadata_editor
      to: metadata_editor
  category: public.app-category.music
  icon: build/branding/musicovite.icns
  target:
    - target: dmg
    - target: zip
  # 代码签名配置（需要开发者证书）
  # identity: "Developer ID Application: Your Name (TEAM_ID)"
  # hardenedRuntime: true
  # gatekeeperAssess: false
  # entitlements: build/entitlements.mac.plist
  # entitlementsInherit: build/entitlements.mac.plist

# Windows 配置
win:
  icon: build/branding/musicovite.ico
  extraResources:
    - from: dist/main/metadata_editor.exe
      to: metadata_editor.exe
    - from: "dist/main/NativeAudio.node"
      to: "NativeAudio.node"
      filter: ["**/*"]
  target:
    - nsis
    - portable
  # 代码签名配置（需要证书）
  # certificateFile: path/to/certificate.p12
  # certificatePassword: ${env.WIN_CSC_KEY_PASSWORD}
  # signingHashAlgorithms: ['sha256']
  # signAndEditExecutable: true

# Linux 配置
linux:
  extraResources:
    - from: dist/main/metadata_editor
      to: metadata_editor
  icon: build/branding/png/
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
    - target: rpm
      arch:
        - x64
    - target: tar.gz
      arch:
        - x64
  category: AudioVideo
  synopsis: "本地音乐播放器"
  description: "一款高颜值、插件化的本地音乐播放器"
# NSIS Windows 安装程序配置
nsis:
  artifactName: ${productName}-setup-${version}-${arch}.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  installerIcon: build/branding/musicovite.ico
  uninstallerIcon: build/branding/musicovite.ico
  allowToChangeInstallationDirectory: true
  oneClick: false

# Windows 便携版配置
portable:
  artifactName: ${productName}-portable-${version}-${arch}.${ext}

# DMG macOS 安装程序配置
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
  iconSize: 100
  iconTextSize: 12
  window:
    width: 540
    height: 380
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

# AppImage Linux 配置
appImage:
  artifactName: ${productName}-${version}-${arch}.${ext}
